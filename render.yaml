services:
  - type: web
    name: trum-dop-vn
    runtime: python
    buildCommand: pip install -r requirements.txt && python database.py && python seed.py
    startCommand: gunicorn app:app --config gunicorn_config.py
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.0
